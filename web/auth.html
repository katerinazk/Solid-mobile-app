<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MedPod</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #1f3b57;
      background: #f4f7fa;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 15px; line-height: 1.5; margin: 0 0 16px; color: #45607a; }
    a { color: #1f3b57; font-weight: 600; }
  </style>
</head>
<body>
  <h1>MedPod</h1>
  <p id="status">Επιστροφή στην εφαρμογή…</p>
  <p><a id="manual" href="#">Ανοίξτε την εφαρμογή</a></p>

  <script>
    // Η σελίδα-γέφυρα της σύνδεσης με το Solid Pod.
    //
    // Υπάρχει για έναν μόνο λόγο: ο Solid server γράφει στην οθόνη συγκατάθεσης την προέλευση
    // της διεύθυνσης επιστροφής. Ένα σχήμα εφαρμογής δεν έχει προέλευση και εμφανιζόταν "null".
    // Με αυτή τη σελίδα, ο κάτοχος του Pod διαβάζει το όνομα της εφαρμογής πριν δώσει πρόσβαση
    // στον ιατρικό του φάκελο.
    //
    // Δεν κρατάει, δεν στέλνει και δεν καταγράφει τίποτα. Ο κωδικός εξουσιοδότησης περνάει από
    // τη διεύθυνση και προωθείται αμέσως στην εφαρμογή, που τον ανταλλάσσει με token μέσα στη
    // συσκευή. Κανένα ιατρικό δεδομένο δεν περνάει ποτέ από εδώ.
    var target = 'solidmedicalapp://auth' + window.location.search + window.location.hash;

    document.getElementById('manual').setAttribute('href', target);
    window.location.replace(target);

    // Αν το λειτουργικό δεν ανοίξει την εφαρμογή, μένει ο σύνδεσμος για το χέρι.
    setTimeout(function () {
      document.getElementById('status').textContent =
        'Αν δεν άνοιξε μόνη της η εφαρμογή, πατήστε τον σύνδεσμο.';
    }, 2000);
  </script>
</body>
</html>
